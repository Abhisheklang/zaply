[project]
name = "zaply-eval"
version = "0.2.0"
description = "Harbor agent wrapper and remote orchestration CLI for Zaply's eval-cli"
requires-python = ">=3.12"
dependencies = ["harbor==0.15.0", "modal==1.5.0"]

[project.scripts]
zaply-eval = "zaply_eval.cli:main"

[tool.setuptools]
packages = ["zaply_eval"]
package-dir = { zaply_eval = "." }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
