# Zaply extension pack: Web

name = "Web"
description = "Frameworks, snippets, and tooling for web development, on top of the HTML, CSS, JavaScript, and TypeScript support already built into Zaply."

extensions = [
    "astro",
    "angular",
    "vue",
    "svelte",
    "biome",
    "emmet",
    "html-snippets",
    "javascript-snippets",
    "jest-snippets",
    "live-server",
    "mdx",
    "graphql",
    "prisma",
    "scss",
    "pug",
]
